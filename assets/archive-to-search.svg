<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="t"><title id="t">Da archivio Markdown a Prompt Search</title><rect width="1400" height="680" fill="#f7f9fc"/><text x="700" y="72" text-anchor="middle" font-family="Arial" font-size="42" font-weight="800" fill="#172033">Da archivio a ricerca immediata</text><g transform="translate(90 135)"><rect width="430" height="450" rx="24" fill="#fff" stroke="#e1e7f0"/><text x="30" y="52" font-family="Arial" font-size="20" font-weight="700" fill="#263149">ARCHIVIO_MD</text><g font-family="Arial" font-size="17" fill="#526078"><text x="32" y="115">📁 01_WORKFLOW</text><text x="32" y="165">📁 02_WRITING</text><text x="32" y="215">📁 03_RESEARCH</text><text x="32" y="265">📁 04_QUALITY</text><text x="32" y="315">📁 05_TEMPLATES</text><text x="32" y="365">📁 06_PROJECTS</text></g></g><path d="M570 360h220" stroke="#245ee6" stroke-width="10" stroke-linecap="round"/><path d="M760 325l45 35-45 35" fill="none" stroke="#245ee6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(850 135)"><rect width="460" height="450" rx="24" fill="#fff" stroke="#dfe6f2"/><text x="30" y="55" font-family="Arial" font-size="24" font-weight="800" fill="#182132">Prompt <tspan fill="#245ee6">Search.</tspan></text><rect x="30" y="85" width="400" height="58" rx="16" fill="#fff" stroke="#7fa3ff" stroke-width="2"/><text x="62" y="122" font-family="Arial" font-size="20" fill="#273247">workflow</text><rect x="30" y="166" width="400" height="96" rx="15" fill="#f9fbff" stroke="#e2e8f3"/><text x="50" y="196" font-family="Arial" font-size="12" fill="#78879c">DEMO</text><text x="50" y="227" font-family="Arial" font-size="19" font-weight="700" fill="#1d2636">Elemento trovato</text><text x="30" y="352" font-family="Arial" font-size="18" fill="#526078">Cerca → apri → copia</text><text x="30" y="388" font-family="Arial" font-size="18" fill="#526078">senza navigare file uno a uno.</text></g></svg>